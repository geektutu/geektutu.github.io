  // Copy constants (is:inline scripts are not processed by Vite)
  const indexMissing = 'Search index not built yet — run `npm run build` first.';
  const statusSearching = 'Searching…';
  const statusNotFound = (term) => `No results for “${term}”.`;
  const statusFound = (n) => `${n} results found`;

  const input = document.getElementById('search-input');
  const status = document.getElementById('search-status');
  const results = document.getElementById('results');

  let pagefind;
  async function loadPagefind() {
    if (!pagefind) {
      try {
        // is:inline scripts bypass Vite; import the pagefind module from /public natively
        pagefind = await import('/pagefind/pagefind.js');
      } catch (e) {
        status.textContent = indexMissing;
      }
    }
    return pagefind;
  }

  function excerpt(html) {
    if (!html) return '';
    return html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  }

  async function run() {
    const term = input.value.trim();
    results.innerHTML = '';
    if (!term) {
      status.textContent = '';
      return;
    }
    const pf = await loadPagefind();
    if (!pf) return;
    status.textContent = statusSearching;
    const search = await pf.search(term);
    if (!search || !search.results?.length) {
      status.textContent = statusNotFound(term);
      return;
    }
    status.textContent = statusFound(search.results.length);
    for (const r of search.results.slice(0, 20)) {
      const data = await r.data();
      const el = document.createElement('a');
      el.href = data.url;
      el.className = 'result-item';
      el.innerHTML = `
        <span class="result-title">${data.meta?.title ?? data.url}</span>
        <div class="result-meta">${data.url}</div>
        <p class="result-excerpt">${data.excerpt ?? excerpt(data.content ?? '').slice(0, 180) + '…'}</p>
      `;
      results.appendChild(el);
    }
  }

  input.addEventListener('input', debounce(run, 250));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') run();
  });

  // Support /en/search/?q=xxx prefill (paired with WebSite SearchAction structured data)
  const q = new URLSearchParams(location.search).get('q')?.trim();
  if (q) {
    input.value = q;
    run();
  }

  function debounce(fn, ms) {
    let t;
    return () => {
      clearTimeout(t);
      t = window.setTimeout(fn, ms);
    };
  }
</script>
